{% extends "layout.html" %}

{% block title %}
     sell
{% endblock %}

[% block main %]
   <form action="/sell" method="post>
    <div class="mb-3">
        <select class="form-select mx-auto w-auto" name="symbol" aria-label="Default select example">
            <option disabled select>symbol</option>option></option>
            {% for stock in stock %}
              <option value="{{stock.symbol}}">{{ stock.symbol }}</option>
              {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <input autocomplete="off" class="form-control mx-auno w-auto" name="shares" placeholder="shares" type="number">
    </div>
    <button class="btn btn-primary" type="submit">Sell</button>
    </form>
{% endblock %}
