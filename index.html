<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
          document.addEventListener("DOMContentLoaded", function() {
            let correctButtons = document.querySelectorAll(".correct");
                for (let i = 0; i < correctButtons.length; i++) {
                    correctButtons[i].addEventListener("click", function() {
                        correctButtons[i].style.backgroundColor = "green";
                        document.querySelector("#feedback1").innerHTML = "Correct!";
                    });
                }

                let incorrectButtons = document.querySelectorAll(".incorrect");
                for (let i = 0; i < incorrectButtons.length; i++) {
                    incorrectButtons[i].addEventListener("click", function() {
                        incorrectButtons[i].style.backgroundColor = "red";
                        document.querySelector("#feedback1").innerHTML = "Incorrect";
                    });
                }


                document.querySelector("#check").addEventListener("click", function(event) {
                    event.preventDefault();
                    let input = document.querySelector("#name");
                    if (input.value.trim().toLowerCase() === "success") {
                        input.style.backgroundColor = "green";
                        document.querySelector("#feedback2").innerHTML = "Correct!";
                    } else {
                        input.style.backgroundColor = "red";
                        document.querySelector("#feedback2").innerHTML = "Incorrect";
                    }
                });
           });

        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                 <h3> What isn't the meaning of Life?</h3>
                 <button class="incorrect"> Feeling & Experience </button>
                 <button class="incorrect"> Wealth$ & power^ </button>
                 <button class="incorrect"> Goals & Success ->( </button>
                 <button class="incorrect"> Nothing! </button>
                 <button class="incorrect"> Changes... </button>
                 <button class="incorrect"> Love & Happines :) </button>
                 <button class="correct"> Comparission & Competition +- </button>
                 <button class="incorrect"> Independance </button>
                 <button class="incorrect"> Create a History </button>
                 <p id="feedback1"></p>

            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3> You will be Fail or Success?</h3>
                <form>
                    <input autocomplete = "Off" autofocus id ="name" placeholder="Answer" type="Text">
                    <button id ="check">Check Answer</button>
                    <p id="feedback2"></p>
                </form>
            </div>
        </div>
    </body>
</html>
